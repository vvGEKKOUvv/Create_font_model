<header>
  <a class="brand" href="./"><span class="brand-icon">◈</span> PATH<span class="brand-slash">/</span>FORM</a>
  <span class="header-label">SVG → 3D STUDIO</span>
  <div class="history-actions"><button id="undo" class="subtle" disabled aria-label="元に戻す">↶ 元に戻す</button><button id="redo" class="subtle" disabled aria-label="やり直す">↷ やり直す</button></div>
  <div class="project-actions"><button id="project-save" class="subtle">状態を保存</button><button id="project-open" class="subtle">状態を読み込む</button><input id="project-file" type="file" accept=".pathform,.json,application/json" hidden/></div>
  <button id="export" class="primary">↓ OBJ を書き出す</button>
</header>
<main>
  <section class="workspace">
    <div class="workspace-tabs" role="tablist" aria-label="編集ビュー">
      <button id="tab-3d" class="active" role="tab" aria-selected="true" aria-controls="view-3d">3D ビューポート</button>
      <button id="tab-uv" role="tab" aria-selected="false" aria-controls="view-uv" tabindex="-1">UV MAP</button>
    </div>
    <div id="view-3d" class="workspace-view" role="tabpanel" aria-labelledby="tab-3d">
      <div class="viewport-heading"><span><i class="live-dot"></i> LIVE PREVIEW</span><label class="wireframe-toggle"><input id="wireframe" type="checkbox"/> ワイヤーフレーム</label><select id="wireframe-mode" aria-label="ワイヤーフレーム表示方式"><option value="lines">線のみ</option><option value="hidden">線のみ（奥の面を隠す）</option><option value="overlay" selected>シェーダーに重ねる</option></select><button id="fit" class="subtle">⊡ 全体表示</button></div>
      <div id="viewport"></div>
      <div class="view-caption"><span id="mesh-info">—</span></div>
    </div>
    <div id="view-uv" class="workspace-view" role="tabpanel" aria-labelledby="tab-uv" hidden>
      <div class="uv-panel">
        <div class="uv-heading"><span>UV MAP <small>展開・調整</small></span><span class="tiny-label">UV 座標を確認</span></div>
        <canvas id="uv-canvas" width="700" height="600" aria-label="UV 展開。頂点編集を有効にして頂点をドラッグ"></canvas>
      </div>
    </div>
    <div id="message" role="status"></div>
  </section>
  <aside class="right-panel" aria-label="オブジェクトと設定">
    <details class="control-section" open>
      <summary>パスの読み込み <span>SOURCE</span></summary>
      <label class="dropzone" id="dropzone">
        <input type="file" id="file" accept=".svg,image/svg+xml" multiple hidden/>
        <span class="upload-icon"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M12 16V3m-5 5 5-5 5 5M4 15v6h16v-6"/></svg></span>
        <strong>SVG を追加</strong>
      </label>
      <button id="path-editor-open" class="subtle">パスを調整して読み込む</button>
      <input type="file" id="path-editor-file" accept=".svg,image/svg+xml" multiple hidden/>
    </details>
    <details id="objects-details" class="control-section" open>
      <summary>オブジェクト選択 <span id="object-count">0</span></summary>
      <div id="objects"></div>
      <div class="object-actions path-actions"><button id="edit-path" class="subtle" disabled>パスを編集</button><button id="source-reload" class="subtle" disabled>パスを再読み込み</button></div>
      <button id="source-restore" class="subtle" disabled title="保存された参照形状へ戻します。以前のプロジェクトは先にパスを再読み込みしてください。">参照形状に戻す</button><input id="source-reload-file" type="file" accept=".svg,image/svg+xml" hidden/>
      <div class="object-actions"><button id="duplicate" class="subtle" disabled>複製</button><button id="delete-object" class="subtle" disabled aria-label="選択したパスを削除">削除</button><button id="reorder-up" class="subtle" disabled>↑ 上へ</button><button id="reorder-down" class="subtle" disabled>↓ 下へ</button></div>
      <label class="export-folder-option"><input id="export-folder" type="checkbox"/> OBJ の保存先を指定</label>
      <p class="export-visibility-note">非表示のオブジェクトは書き出し対象外</p>
      <div class="selection-heading"><p id="selected-name" class="muted">オブジェクトを選択</p><button id="reset" class="subtle">リセット ↺</button></div>
    </details>
    <details class="control-section" id="preset-settings"></details>
    <details class="control-section" id="reduction-settings" open>
      <summary>パスのリダクション <span>REDUCTION</span></summary>
      ${og(`reductionTolerance`,`許容誤差`,0,0,5,.01)}
      <p id="reduction-info" class="control-note">—</p>
      <button id="apply-reduction" class="subtle" disabled>パスに適用</button>
    </details>
    <details class="control-section" id="mesh-reduction-settings" open>
      <summary>オブジェクトのリダクション <span>MESH</span></summary>
      ${og(`meshReductionPercentage`,`削減率 %`,0,0,90,1)}
      <p id="mesh-reduction-info" class="control-note">—</p>
    </details>
    <details class="control-section" id="offset-settings" open>
      <summary>輪郭のオフセット <span>OFFSET</span></summary>
      ${og(`pathOffset`,`量`,0,-100,100,.01)}
      <p id="offset-info" class="control-note"></p>
    </details>
    <details class="control-section" open>
      <summary>押し出し <span>EXTRUDE</span></summary>
      ${og(`depth`,`奥行き`,24,.01,100,.1)}
      <label class="toggle-row"><span>原点を境にミラー</span><input id="extrusionMirror" type="checkbox" checked/><i></i></label>
      <label class="toggle-row"><span>原点側の面を塞ぐ</span><input id="extrusionCap" type="checkbox" checked/><i></i></label>
    </details>
    <details id="bevel-settings" class="control-section" open>
      <summary>ベベル <span>BEVEL</span></summary>
      ${og(`bevelSize`,`奥行方向`,3,0,12,.1)}
      ${og(`bevelWidth`,`輪郭幅`,3,0,100,.1)}
      <label class="toggle-row"><span>正面が合流するまで広げる</span><input id="bevelContinue" type="checkbox" checked/><i></i></label>
      ${og(`bevelSegments`,`区間内の分割数`,4,0,16,1)}
      <p id="geometry-status" class="control-note"></p>
    </details>
    <details id="hollow-settings" class="control-section" open>
      <summary>内側をくり抜く <span>HOLLOW</span></summary>
      <label class="toggle-row"><span>中空にする</span><input id="hollow" type="checkbox"/><i></i></label>
      ${og(`wallThickness`,`壁の厚み`,4,.001,30,.01)}
    </details>
    <details id="bevel-curve-settings" class="control-section" open>
      <summary>ベベルカーブ <span>PROFILE</span></summary>
      <div class="curve-display"></div>
    </details>
    <details class="control-section" open>
      <summary>マテリアル <span>MATERIAL</span></summary>
      <label class="material-select"><span>対象</span><select id="material-region"><option value="front">正面・背面・ベベル</option><option value="side">側面</option></select></label>
      <label class="material-select"><span>質感</span><select id="material-type"><option value="standard">標準</option><option value="metal">金属</option></select></label>
      <label class="material-select"><span>環境</span><select id="environment-preset"><option value="studio">スタジオ</option><option value="softbox">ソフトボックス</option><option value="outdoor">屋外</option><option value="sunset">夕景</option></select></label>
      <label class="color-row"><input type="color" id="color" value="#b0b0b0"/><span id="color-value">#B0B0B0</span><span class="muted">カラー</span></label>
      ${og(`opacity`,`透明度 %`,0,0,100,1)}
    </details>
    <details id="uv-settings" class="control-section" open>
      <summary>UV 設定 <span>UV MAP</span></summary>
      <label class="material-select"><span>UV 対象</span><select id="uv-region"><option value="front">正面・背面・ベベル</option><option value="side">側面</option></select></label>
      <label class="material-select"><span>正面 UV</span><select id="front-uv-fit"><option value="stretch">領域いっぱいに広げる</option><option value="contain" selected>縦横比を保持</option></select></label>
      <div class="uv-tools"><label><input type="checkbox" id="uv-edit-mode"/> UV 頂点編集</label><button id="uv-clear" class="subtle">UV 修正をクリア ↺</button><span>頂点をドラッグ · 同じ UV 座標をまとめて編集</span></div>
      <div class="uv-inputs">
        ${og(`uvScaleX`,`スケール U`,1,.01,20,.1,!1)}
        ${og(`uvScaleY`,`スケール V`,1,.01,20,.1,!1)}
        ${og(`uvOffsetX`,`移動 U`,0,-20,20,.1,!1)}
        ${og(`uvOffsetY`,`移動 V`,0,-20,20,.1,!1)}
        ${og(`uvRotation`,`回転 °`,0,-360,360,1,!1)}
      </div>
